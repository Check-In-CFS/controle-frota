# Ambiente de testes local. Uso: docker compose up --build
services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # LAN_IP = IP do seu computador na rede, para abrir no celular (veja o README). Sem ele, só localhost.
      FRONTEND_URL: http://localhost:5173,http://${LAN_IP:-localhost}:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://${LAN_IP:-localhost}:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
